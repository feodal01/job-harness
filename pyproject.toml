[project]
name = "job-harness"
version = "0.2.0"
description = "Universal job search and application harness"
requires-python = ">=3.12"
dependencies = [
    "rebrowser-playwright>=1.52.0",
    "pyyaml>=6.0",
]

[project.scripts]
job-harness = "job_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_harness"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
