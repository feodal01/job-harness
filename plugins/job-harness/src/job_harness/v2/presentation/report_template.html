<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>__TITLE__</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #18202a;
      --muted: #657184;
      --line: #d9dee7;
      --accent: #0f766e;
      --good: #166534;
      --warn: #9a3412;
      --bad: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(246, 247, 249, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    main { padding: 18px 0 36px; }
    .request-summary {
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .request-summary-inner {
      display: grid;
      gap: 10px;
      padding: 14px;
    }
    .request-summary h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
      letter-spacing: 0;
    }
    .wrap {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
    }
    .top {
      display: grid;
      gap: 14px;
      padding: 18px 0 14px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .meta, .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .meta {
      align-items: flex-start;
    }
    .run-id {
      color: var(--muted);
      font-size: 13px;
    }
    .run-id code {
      color: var(--ink);
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .pill {
      display: inline-grid;
      grid-template-columns: max-content minmax(0, 1fr);
      column-gap: 4px;
      align-items: baseline;
      flex: 0 1 auto;
      max-width: 100%;
      min-width: 0;
      min-height: 28px;
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--muted);
      white-space: normal;
    }
    .pill strong {
      color: var(--ink);
      font-weight: 650;
    }
    .pill-value {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .tabs {
      display: flex;
      gap: 6px;
      padding-bottom: 12px;
    }
    button, select, input {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
    }
    button {
      min-height: 34px;
      padding: 6px 11px;
      cursor: pointer;
    }
    button.active {
      border-color: var(--accent);
      background: #e8f5f2;
      color: #083b36;
      font-weight: 650;
    }
    select {
      min-height: 34px;
      padding: 6px 9px;
    }
    .results {
      display: grid;
      gap: 10px;
    }
    article {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    article.filtered {
      border-left: 4px solid var(--warn);
    }
    article.kept {
      border-left: 4px solid var(--good);
    }
    .card-head {
      display: grid;
      gap: 6px;
    }
    .title-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .title-main {
      display: flex;
      min-width: 0;
      gap: 10px;
      align-items: flex-start;
    }
    .title-text {
      display: grid;
      min-width: 0;
      gap: 3px;
    }
    .company-line {
      color: var(--muted);
      font-weight: 650;
    }
    .company-line.excluded-reason {
      display: inline-block;
      padding: 2px 6px;
      border: 1px solid #fecaca;
      border-radius: 6px;
      background: #fef2f2;
      color: var(--bad);
    }
    .ordinal {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 30px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #eef2f6;
      color: var(--muted);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 6px 14px;
      color: var(--muted);
    }
    .field.excluded-reason {
      margin: -2px -6px;
      padding: 2px 6px;
      border: 1px solid #fecaca;
      border-radius: 6px;
      background: #fef2f2;
      color: var(--bad);
    }
    .grid b {
      color: var(--ink);
      font-weight: 650;
    }
    .field.excluded-reason b {
      color: var(--bad);
    }
    .terminal-status {
      min-height: 34px;
      padding: 7px 10px;
      border: 1px solid #fecaca;
      border-radius: 6px;
      background: #fef2f2;
      color: var(--bad);
      font-weight: 650;
    }
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 2px;
    }
    .apply-channels,
    .company-contacts {
      display: grid;
      gap: 6px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }
    .apply-channels-title,
    .company-contacts-title {
      color: var(--ink);
      font-weight: 700;
    }
    .apply-channel-links,
    .company-contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .apply-channel,
    .company-contact {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      font-weight: 650;
    }
    .skill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 7px;
      border-radius: 6px;
      background: #eef2f6;
      color: #475569;
      font-weight: 650;
    }
    details {
      border-top: 1px solid var(--line);
      padding-top: 9px;
    }
    summary {
      cursor: pointer;
      color: var(--accent);
      font-weight: 650;
    }
    pre {
      margin: 10px 0 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #2a3441;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .debug-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    .debug-meta b {
      color: #475569;
      font-weight: 650;
    }
    .empty {
      padding: 24px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 700px) {
      .wrap { width: min(100vw - 20px, 1180px); }
      .title-row { display: grid; }
      .title-main { align-items: flex-start; }
      .tabs button { flex: 1 1 auto; }
      h1 { font-size: 19px; }
      h2 { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <div>
        <h1 id="page-title">Job search results</h1>
        <div class="run-id">Run ID: <code id="run-id"></code></div>
      </div>
      <div class="meta execution-summary" id="execution-summary"></div>
      <div class="filters">
        <select id="source-filter" aria-label="Source"></select>
      </div>
      <div class="tabs" role="tablist">
        <button id="tab-kept" type="button" data-view="kept" class="active">Kept</button>
        <button id="tab-filtered" type="button" data-view="filtered">Filtered out</button>
        <button id="tab-all" type="button" data-view="all">All</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="request-summary">
      <div class="request-summary-inner">
        <h2>Search request</h2>
        <div class="meta" id="request-params"></div>
      </div>
    </section>
    <section class="results" id="results"></section>
  </main>
  <script id="job-harness-payload" type="application/json">__PAYLOAD__</script>
  <script>
    const payload = JSON.parse(document.getElementById("job-harness-payload").textContent);
    const state = { view: "kept", source: "" };

    const kept = Array.isArray(payload.results) ? payload.results : [];
    const filtered = Array.isArray(payload.filtered_out_results) ? payload.filtered_out_results : [];
    const allRows = kept.concat(filtered);

    const text = (value) => value === null || value === undefined ? "" : String(value).trim();
    const list = (value) => Array.isArray(value) ? value.map(text).filter(Boolean) : [];
    const uniq = (values) => Array.from(new Set(values.filter(Boolean))).sort((a, b) => a.localeCompare(b));

    function pill(label, value) {
      const el = document.createElement("span");
      el.className = "pill";
      const labelEl = document.createElement("strong");
      labelEl.textContent = label;
      const valueEl = document.createElement("span");
      valueEl.className = "pill-value";
      valueEl.textContent = text(value);
      el.replaceChildren(labelEl, valueEl);
      return el;
    }

    function escapeHtml(value) {
      return text(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function matches(row) {
      if (state.view === "kept" && decision(row) !== "kept") return false;
      if (state.view === "filtered" && decision(row) !== "filtered_out") return false;
      if (state.source && row.sourceId !== state.source) return false;
      return true;
    }

    function decision(row) {
      return text(row.decision) || "kept";
    }

    function renderHeader() {
      document.getElementById("run-id").textContent = text(payload.run_id) || "unknown";
      const executionQuality = text(payload.execution_quality) || "unknown";
      const sourceCoverage = payload.source_coverage && typeof payload.source_coverage === "object"
        ? payload.source_coverage
        : {};
      document.getElementById("execution-summary").replaceChildren(
        summaryField("Quality", executionQuality),
        summaryField("Sources complete", `${sourceCoverage.complete}/${sourceCoverage.planned}`),
        summaryField("Sources degraded", sourceCoverage.degraded),
        summaryField("Sources failed", sourceCoverage.failed)
      );
      document.getElementById("tab-kept").textContent = `Kept (${kept.length})`;
      document.getElementById("tab-filtered").textContent = `Filtered out (${filtered.length})`;
      document.getElementById("tab-all").textContent = `All (${allRows.length})`;
    }

    function summaryField(label, value) {
      return pill(label, text(value) || "0");
    }

    function renderSearchRequest() {
      const container = document.getElementById("request-params");
      const request = payload.search_request && typeof payload.search_request === "object"
        ? payload.search_request
        : {};
      const items = [
        requestField("Query", listText(request.query_variants, "not recorded")),
        requestField("Grade", listText(request.grades, "N/a")),
        requestField("Compensation", compensationCriterionText(request.compensation) || "N/a"),
        requestField("Published since", text(request.published_since) || "N/a"),
        requestField("Work format", listText(request.work_formats, "N/a")),
        requestField("Remote scope", listText(request.remote_scopes, "N/a")),
        requestField("Vacancy geography", listText(request.vacancy_geographies, "N/a")),
        requestField("Employer geography", listText(request.employer_geographies, "N/a")),
        requestField("Scenarios", scenarioText(request.scenarios)),
        requestField("Sources", listText(request.sources, "Full catalog")),
        requestField("Source types", listText(request.source_types, "All types")),
        requestField("Relocation", optionalBooleanText(request.relocation)),
        requestField("Exclude companies", listText(request.exclude_companies, "N/a")),
        requestField("Exclude text", exclusionText(request.exclude_text) || "N/a"),
        requestField("Append to run", text(request.append_to_run_id) || "New run")
      ];
      container.replaceChildren(...items);
    }

    function requestField(label, value) {
      return pill(label, value);
    }

    function listText(value, emptyText) {
      const items = list(value);
      return items.length ? items.join(", ") : (emptyText || "N/a");
    }

    function optionalBooleanText(value) {
      if (value === true) return "Required";
      if (value === false) return "Excluded";
      return "N/a";
    }

    function compensationCriterionText(value) {
      if (!value) return "";
      const gross = value.gross === true ? " gross" : value.gross === false ? " net" : "";
      return `${text(value.minimum)} ${text(value.currency)} / ${text(value.period)}${gross}`;
    }

    function scenarioText(value) {
      if (!Array.isArray(value) || !value.length) return "N/a";
      return value.map((scenario, index) => {
        if (!scenario || typeof scenario !== "object") return "";
        const parts = [
          fieldText("Work format", scenario.work_formats),
          fieldText("Remote scope", scenario.remote_scopes),
          fieldText("Vacancy geography", scenario.vacancy_geographies),
          fieldText("Employer geography", scenario.employer_geographies),
          scenario.relocation === true ? "Relocation: required" : "",
          scenario.relocation === false ? "Relocation: excluded" : ""
        ].filter(Boolean);
        return `Scenario ${index + 1}: ${parts.join("; ")}`;
      }).filter(Boolean).join(" | ") || "N/a";
    }

    function fieldText(label, value) {
      const values = list(value);
      return values.length ? `${label}: ${values.join(", ")}` : "";
    }

    function exclusionText(value) {
      if (!Array.isArray(value)) return "";
      return value.map((item) => {
        if (!item || typeof item !== "object") return "";
        const mode = text(item.mode) || "substring";
        return `${mode}: ${text(item.pattern)}`;
      }).filter(Boolean).join(", ");
    }

    function fillSelect(id, firstLabel, values) {
      const select = document.getElementById(id);
      const selected = select.value;
      select.replaceChildren(new Option(firstLabel, ""));
      for (const value of values) select.append(new Option(value, value));
      select.value = values.includes(selected) ? selected : "";
    }

    function renderFilters() {
      fillSelect("source-filter", "All sources", uniq(allRows.map((row) => text(row.sourceId))));
    }

    function renderResults() {
      const container = document.getElementById("results");
      const rows = allRows.filter(matches);
      container.replaceChildren();
      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No listings match the current view.";
        container.append(empty);
        return;
      }
      container.append(...rows.map((row, index) => renderRow(row, index + 1)));
    }

    function renderRow(row, ordinal) {
      const article = document.createElement("article");
      article.className = decision(row) === "filtered_out" ? "filtered" : "kept";

      const head = document.createElement("div");
      head.className = "card-head";
      const titleRow = document.createElement("div");
      titleRow.className = "title-row";
      const titleMain = document.createElement("div");
      titleMain.className = "title-main";
      const ordinalBadge = document.createElement("span");
      ordinalBadge.className = "ordinal";
      ordinalBadge.textContent = String(ordinal);
      const titleText = document.createElement("div");
      titleText.className = "title-text";
      const title = document.createElement("h2");
      const url = text(row.vacancyUrl);
      if (url) {
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noreferrer";
        link.textContent = text(row.title) || "Untitled vacancy";
        title.append(link);
      } else {
        title.textContent = text(row.title) || "Untitled vacancy";
      }
      titleText.append(title);
      const company = companyName(row.company);
      if (company) {
        const companyLine = document.createElement("div");
        companyLine.className = "company-line";
        if (hasRemovalReason(row, "excluded_company")) companyLine.classList.add("excluded-reason");
        companyLine.textContent = company;
        titleText.append(companyLine);
      }
      titleMain.append(ordinalBadge, titleText);
      titleRow.append(titleMain);
      head.append(titleRow);

      const grid = document.createElement("div");
      grid.className = "grid";
      const highlightedLabels = highlightedCardFieldLabels(row);
      grid.append(
        cardField("Grade", gradeText(row.grade), highlightedLabels.has("Grade")),
        cardField("Salary", compensationText(row.compensation), highlightedLabels.has("Salary")),
        cardField("Posted", row.postedAt, highlightedLabels.has("Posted")),
        cardField("Work format", workplaceFormatText(row.workplace), highlightedLabels.has("Work format")),
        cardField("Location", locationText(row.location), highlightedLabels.has("Location")),
        cardField("Remote scope", remoteScopeText(row.workplace), highlightedLabels.has("Remote scope")),
        cardField("Relocation", relocationText(row.relocation), highlightedLabels.has("Relocation"))
      );
      head.append(grid);
      article.append(head);
      const terminalStatus = terminalStatusElement(row);
      if (terminalStatus) article.append(terminalStatus);
      const applicationChannels = applicationChannelsElement(row);
      if (applicationChannels) article.append(applicationChannels);
      const companyContacts = companyContactsElement(row);
      if (companyContacts) article.append(companyContacts);
      const skillTags = skillsElement(row);
      if (skillTags) article.append(skillTags);

      const detailParts = detailTextParts(row);
      const body = detailParts.join("\n\n");
      if (body) {
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "Details";
        const pre = document.createElement("pre");
        pre.textContent = body;
        details.append(summary, pre);
        article.append(details);
      }

      const debugFields = [
        debugField("Filter reason", removalReasonText(row)),
        debugField("Source", row.sourceId),
        debugField("Source listing ID", row.sourceListingId),
        debugField("Source variants", list(row.sourceVariants).join(", ")),
        debugField("Duplicate confidence", row.duplicateConfidence)
      ].filter(Boolean);
      if (debugFields.length) {
        const debug = document.createElement("div");
        debug.className = "debug-meta";
        debug.replaceChildren(...debugFields);
        article.append(debug);
      }
      return article;
    }

    function detailTextParts(row) {
      const description = text(row.description);
      const requirements = bodyText(row.requirements);
      const responsibilities = bodyText(row.responsibilities);
      const conditions = bodyText(row.conditions);
      const parts = [];
      if (description) parts.push(description);
      if (requirements && !description.includes(requirements)) parts.push(requirements);
      if (responsibilities) parts.push(responsibilities);
      if (conditions) parts.push(conditions);
      return parts;
    }

    function bodyText(value) {
      return Array.isArray(value) ? list(value).join("\n") : text(value);
    }

    function companyName(value) {
      return value && typeof value === "object" ? text(value.name) : "";
    }

    function locationText(value) {
      if (!value || typeof value !== "object") return "";
      const structured = [value.cities, value.countries, value.regions]
        .map((items) => list(items).join(", "))
        .filter(Boolean)
        .join(" | ");
      return structured || text(value.rawText);
    }

    function gradeText(value) {
      if (!value || typeof value !== "object") return "";
      const resolved = list(value.resolved).join(", ");
      return resolved && value.conflict === true ? `${resolved} (source conflict)` : resolved;
    }

    function compensationText(value) {
      if (!value || typeof value !== "object") return "";
      const bounds = [text(value.minimum), text(value.maximum)].filter(Boolean).join(" – ");
      const period = text(value.period);
      const amount = [bounds, text(value.currency)].filter(Boolean).join(" ");
      const periodic = period ? `${amount || "per"} / ${period}` : amount;
      const gross = value.gross === true ? "gross" : value.gross === false ? "net" : "";
      return [periodic, gross].filter(Boolean).join(" ");
    }

    function workplaceFormatText(value) {
      return value && typeof value === "object" ? list(value.formats).join(", ") : "";
    }

    function remoteScopeText(value) {
      return value && typeof value === "object" ? list(value.remoteScopes).join(", ") : "";
    }

    function relocationText(value) {
      if (!value || typeof value !== "object") return "";
      if (value.supported === false) return "no";
      if (value.supported !== true) return "";
      const destinations = list(value.destinations);
      if (destinations.length) return `yes, to ${destinations.join(", ")}`;
      return "yes, destination not specified";
    }

    function cardField(label, value, highlighted) {
      const valueText = text(value);
      const div = document.createElement("div");
      div.className = highlighted ? "field excluded-reason" : "field";
      div.innerHTML = `<b>${escapeHtml(label)}:</b> ${escapeHtml(valueText || "not specified")}`;
      return div;
    }

    function decisionReasons(row) {
      return list(row.decision_reasons);
    }

    function hasRemovalReason(row, reason) {
      return decisionReasons(row).includes(reason);
    }

    function removalReasonText(row) {
      return decision(row) === "filtered_out" ? visibleDecisionReasons(row).join(", ") : "";
    }

    function visibleDecisionReasons(row) {
      return decisionReasons(row).filter((reason) => reason !== "required_provider_terminal");
    }

    function terminalStatusElement(row) {
      if (!hasRemovalReason(row, "required_provider_terminal")) return null;
      const status = document.createElement("div");
      status.className = "terminal-status";
      status.textContent = "Required details could not be retrieved";
      return status;
    }

    function highlightedCardFieldLabels(row) {
      const labels = new Set();
      const mappings = [
        ["grade_mismatch", "Grade"],
        ["insufficient_evidence:grades", "Grade"],
        ["compensation_below_requested_minimum", "Salary"],
        ["compensation_gross_mismatch", "Salary"],
        ["insufficient_evidence:compensation", "Salary"],
        ["published_before_requested_date", "Posted"],
        ["insufficient_evidence:published_since", "Posted"],
        ["vacancy_geography_mismatch", "Country"],
        ["vacancy_geography_mismatch", "Location"],
        ["insufficient_evidence:vacancy_geographies", "Location"],
        ["remote_scope_mismatch", "Remote scope"],
        ["insufficient_evidence:remote_scopes", "Remote scope"],
        ["work_format_mismatch", "Work format"],
        ["insufficient_evidence:work_formats", "Work format"],
        ["relocation_mismatch", "Relocation"],
        ["insufficient_evidence:relocation", "Relocation"]
      ];
      for (const [reason, label] of mappings) {
        if (hasRemovalReason(row, reason)) labels.add(label);
      }
      return labels;
    }

    function skillsElement(row) {
      const skills = list(row.skills);
      if (!skills.length) return null;
      const container = document.createElement("div");
      container.className = "skills";
      for (const skill of skills) {
        const item = document.createElement("span");
        item.className = "skill";
        item.textContent = skill;
        container.append(item);
      }
      return container;
    }

    function applicationChannelsElement(row) {
      const channels = Array.isArray(row.applicationChannels) ? row.applicationChannels : [];
      const links = channels
        .filter((channel) => channel && typeof channel === "object" && text(channel.value))
        .map((channel) => {
          const link = document.createElement("a");
          link.className = "apply-channel";
          link.href = text(channel.value);
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = text(channel.label) || text(channel.kind) || "Apply";
          return link;
        });
      if (!links.length) return null;
      const container = document.createElement("div");
      container.className = "apply-channels";
      const title = document.createElement("div");
      title.className = "apply-channels-title";
      title.textContent = "Apply channels";
      const linkRow = document.createElement("div");
      linkRow.className = "apply-channel-links";
      linkRow.replaceChildren(...links);
      container.replaceChildren(title, linkRow);
      return container;
    }

    function companyContactsElement(row) {
      const contacts = Array.isArray(row.contacts) ? row.contacts : [];
      const items = contacts
        .filter((contact) => contact && typeof contact === "object" && text(contact.value))
        .map((contact) => {
          const label = text(contact.label) || text(contact.kind) || "Contact";
          const value = text(contact.value);
          const url = contactUrl(text(contact.kind), value);
          const item = url ? document.createElement("a") : document.createElement("span");
          item.className = "company-contact";
          item.textContent = `${label}: ${value}`;
          if (url) {
            item.href = url;
            item.target = "_blank";
            item.rel = "noreferrer";
          }
          return item;
        });
      if (!items.length) return null;
      const container = document.createElement("div");
      container.className = "company-contacts";
      const title = document.createElement("div");
      title.className = "company-contacts-title";
      title.textContent = "Company contacts";
      const itemRow = document.createElement("div");
      itemRow.className = "company-contact-links";
      itemRow.replaceChildren(...items);
      container.replaceChildren(title, itemRow);
      return container;
    }

    function contactUrl(kind, value) {
      if (kind === "email") return `mailto:${value}`;
      if (kind === "phone") return `tel:${value}`;
      if (value.startsWith("https://") || value.startsWith("http://")) return value;
      return "";
    }

    function debugField(label, value) {
      const valueText = text(value);
      if (!valueText) return null;
      const div = document.createElement("div");
      div.innerHTML = `<b>${escapeHtml(label)}:</b> ${escapeHtml(valueText)}`;
      return div;
    }

    function booleanText(value) {
      if (value === true) return "yes";
      if (value === false) return "no";
      return "";
    }

    function setView(view) {
      state.view = view;
      for (const button of document.querySelectorAll(".tabs button")) {
        button.classList.toggle("active", button.dataset.view === view);
      }
      renderResults();
    }

    document.getElementById("source-filter").addEventListener("change", (event) => {
      state.source = event.target.value;
      renderResults();
    });
    for (const button of document.querySelectorAll(".tabs button")) {
      button.addEventListener("click", () => setView(button.dataset.view));
    }

    renderHeader();
    renderSearchRequest();
    renderFilters();
    renderResults();
  </script>
</body>
</html>
