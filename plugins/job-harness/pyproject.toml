[project]
name = "job-harness"
version = "0.2.61"
description = "Universal job search and application harness"
requires-python = ">=3.12"
dependencies = [
    "babel>=2.18.0",
    "fastmcp>=3.3.1",
    "geonamescache>=3.0.0",
    "rebrowser-playwright>=1.52.0",
]

[project.scripts]
job-harness = "job_harness.v1.cli:main"
job-harness-v2 = "job_harness.v2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_harness"]

[tool.hatch.build.targets.wheel.force-include]
"src/job_harness/v2/source_catalog.sql" = "job_harness/v2/source_catalog.sql"
"src/job_harness/v2/runtime/search_service_config.json" = "job_harness/v2/runtime/search_service_config.json"
"src/job_harness/v2/persistence/schema.sql" = "job_harness/v2/persistence/schema.sql"
"src/job_harness/v2/presentation/report_template.html" = "job_harness/v2/presentation/report_template.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "mypy>=2.1.0",
    "ruff>=0.15.15",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "scripts", "tests"]
extend-exclude = [
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",
    "UP047",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
